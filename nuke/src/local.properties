# 2026-11-17 按用户要求入库：nuke 源码自建的 debug/release 统一用仓库内签名 key。
# 只用相对路径，跨机器 clone 后无需修改；SDK 由 ANDROID_HOME/ANDROID_SDK_ROOT 提供，故不写 sdk.dir。
# 登记见仓库根 signing/README.md。
# 注意：设备上已装的 nuke 0.1.2 是上游官方证书 72b63d…（私钥在作者 CI，我们没有），
# 用本文件构建出的是自有 debug 签名包，无法 install -r 覆盖官方包，需卸载重装（属设备变更，先授权）。
signing.storeFile=../../signing/debug.keystore
signing.storePassword=android
signing.keyAlias=androiddebugkey
signing.keyPassword=android
