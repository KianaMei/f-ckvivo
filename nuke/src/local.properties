# 2026-11-17 按用户要求入库：nuke 的 debug/release 统一用仓库内签名的 key。
# signing/debug.keystore = 本机历史在用的 Android debug key 原样副本，
# 证书指纹 19:90:DF:...:12:FB，与已装 debug 包一致，仍可 adb install -r 覆盖。
# 登记见仓库根 signing/README.md。
signing.storeFile=../../signing/debug.keystore
signing.storePassword=android
signing.keyAlias=androiddebugkey
signing.keyPassword=android
